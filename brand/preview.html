<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>محامي نفسك — الشعار</title>
<style>
:root{--bg:#F8F6F1;--surface:#fff;--ink:#0B1F2A;--muted:#6B6F76;--line:#E6E1D8}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#1C1C1C;font-family:system-ui,sans-serif;padding:40px 24px}
h1{font-size:26px;margin:0 0 8px}p.lead{color:var(--muted);margin:0 0 32px;max-width:65ch;line-height:1.8}
.grid{display:grid;gap:24px;grid-template-columns:1fr}@media(min-width:900px){.grid{grid-template-columns:1fr 1fr}}
.panel{border-radius:20px;padding:32px;border:1px solid var(--line)}.panel.light{background:var(--surface)}.panel.dark{background:var(--ink);color:#fff}
h2{font-size:18px;margin:0 0 20px}h3{font-size:13px;font-weight:500;color:var(--muted);margin:24px 0 12px}.dark h3{color:rgba(255,255,255,.6)}
.row{display:flex;align-items:flex-end;gap:28px;flex-wrap:wrap}figure{margin:0;text-align:center}figcaption{font-size:11px;color:var(--muted);margin-top:8px}.dark figcaption{color:rgba(255,255,255,.6)}
img{display:block;max-width:100%;height:auto}.full{max-width:300px}
</style></head><body>
<h1>محامي نفسك — الشعار</h1>
<p class="lead">شعارك الأصلي معزولًا عن خلفيته، مع نسخة متجهية (SVG) تكبر بلا تشويش، وأيقونة بلا اسم للمتصفح والتطبيق.</p>
<div class="grid">
<div class="panel light"><h2>على فاتح</h2>
  <h3>الشعار الكامل (SVG)</h3><div class="full"><img src="option-3/logo.svg" alt=""></div>
  <h3>الأيقونة بأحجام 16 / 32 / 64 / 256</h3><div class="row">
    <figure><img src="option-3/mark.svg" width="16" alt=""><figcaption>16</figcaption></figure>
    <figure><img src="option-3/mark.svg" width="32" alt=""><figcaption>32</figcaption></figure>
    <figure><img src="option-3/mark.svg" width="64" alt=""><figcaption>64</figcaption></figure>
    <figure><img src="option-3/mark.svg" width="256" alt=""><figcaption>256</figcaption></figure></div>
</div>
<div class="panel dark"><h2>على داكن</h2>
  <h3>الشعار الكامل (SVG)</h3><div class="full"><img src="option-3/logo.svg" alt=""></div>
  <h3>الأيقونة بأحجام 16 / 32 / 64 / 256</h3><div class="row">
    <figure><img src="option-3/mark.svg" width="16" alt=""><figcaption>16</figcaption></figure>
    <figure><img src="option-3/mark.svg" width="32" alt=""><figcaption>32</figcaption></figure>
    <figure><img src="option-3/mark.svg" width="64" alt=""><figcaption>64</figcaption></figure>
    <figure><img src="option-3/mark.svg" width="256" alt=""><figcaption>256</figcaption></figure></div>
  <h3>أيقونة التطبيق 512</h3><img src="option-3/app-icon-512.png" style="max-width:160px" alt="">
</div>
</div>
</body></html>
